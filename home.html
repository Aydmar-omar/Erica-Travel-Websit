<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel With Erika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-section">
    <nav class="navbar">
    <div class="logo-container">
    <img src="./logo.png.png" alt="Logo" class="logo">
    </div>
    <ul class="nav-links">
        <li><a href="home.html" class="nav-link active">Home</a></li>
        <li><a href="destination.html" class="nav-link">Destination</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        <li><a href="blog.html" class="nav-link">Blog</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
    </ul>
</nav>
    <div class="hero-content">
        <h1>Looking For <span>Adventure</span> with Erika?</h1>
        <p>Explore the world, one vlog at a time. Join the journey and discover breathtaking destinations.</p>
        <a href="https://www.youtube.com/" class="cta-btn">Watch Latest Vlog</a>
    </div>
</header>
</div>
<script>document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add('fade-in');
    const links = document.querySelectorAll('.nav-link, .cta-btn, .back-btn');
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            if (this.href && !this.href.includes('#')) {
                e.preventDefault();
                const target = this.href;
                document.body.classList.remove('fade-in');
                document.body.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = target;
                }, 500);
            }
        });
    });
});</script>
</body>
</html>
